<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>PressBig / The Album Page (sketch)</title>
<style>
:root{--blue:#1f3bd8;--foil:#ffd23f;--white:#fff;--red:#ef3b2d;--ink:#0d1440}
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden;background:var(--blue);font-family:Arial,sans-serif;color:var(--white)}
.top{display:flex;justify-content:space-between;align-items:center;padding:26px 48px}
.top b{font:900 40px/1 Impact,"Arial Narrow",sans-serif;letter-spacing:.03em}
.top span{font:800 15px/1 Arial;letter-spacing:.16em}
.page{margin:0 48px;background:#1a33c0;border:4px solid #fff;border-radius:18px;height:760px;padding:34px;display:grid;grid-template-columns:420px 1fr;gap:34px;position:relative}
h1{font:900 112px/.9 Impact,"Arial Narrow",sans-serif;text-transform:uppercase}
h1 em{font-style:normal;color:var(--foil)}
.sub{font:400 24px/1.35 Arial;margin-top:22px;max-width:380px}
.count{margin-top:28px;font:800 20px/1 Arial;letter-spacing:.08em;color:var(--foil)}
.bar{height:16px;background:#12248f;border-radius:9px;margin-top:12px;overflow:hidden}.bar i{display:block;width:33%;height:100%;background:var(--foil)}
.cta{display:inline-block;margin-top:30px;background:var(--foil);color:var(--ink);font:900 22px/1 Arial;padding:20px 28px;border-radius:12px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:20px}
.slot{border:3px dashed #7f95ff;border-radius:12px;position:relative;display:flex;align-items:flex-end;padding:10px;font:800 18px/1 Arial;color:#7f95ff}
.stk{border:6px solid #fff;border-style:solid;background:linear-gradient(135deg,#ffd23f,#ff7a2f);color:var(--ink);border-radius:10px;transform:rotate(-2deg);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.stk.b{background:linear-gradient(135deg,#7bd3ff,#2b6cff);transform:rotate(1.5deg)}
.stk.c{background:linear-gradient(135deg,#ff9bd0,#e5322b);transform:rotate(-1deg)}
.big{grid-column:span 2;grid-row:span 2}
.new{position:absolute;right:-14px;top:-14px;background:var(--red);color:#fff;border-radius:50%;width:64px;height:64px;display:grid;place-items:center;font:900 16px Arial;transform:rotate(12deg)}
</style></head><body>
<div class="top"><b>PRESSBIG</b><span>THE DAILY ALBUM &#9656; FRI 13 NOV</span></div>
<div class="page">
  <div>
    <h1>Fill<br>today's<br><em>page.</em></h1>
    <p class="sub">Twelve picks across film, style, gadgets and culture. Collect them all.</p>
    <div class="count">4 / 12 COLLECTED</div><div class="bar"><i></i></div>
    <a class="cta">Peel the first pick &#8594;</a>
  </div>
  <div class="slots">
    <div class="slot stk big"><span class="new">NEW</span></div>
    <div class="slot stk b"></div><div class="slot stk c"></div>
    <div class="slot stk c"></div><div class="slot stk"></div>
    <div class="slot">05</div><div class="slot">06</div><div class="slot">07</div><div class="slot">08</div>
    <div class="slot">09</div><div class="slot">10</div>
  </div>
</div>
</body></html>
