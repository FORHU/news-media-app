name: Deploy Production (EC2)

# FORHU/news-media-app -> newsicon-production-ec2 (i-09971b56ae34dbcd4, EIP 47.128.1.225).
#
# Replaces the Coolify deploy (deploy-production.yml):
#   build -> push to ECR -> .env into Parameter Store -> SSM Run Command on the box
#
# No SSH. The box is addressed by instance ID through SSM, so there is no key pair, no
# EC2_HOST/EC2_USERNAME/EC2_SSH_KEY secret, and port 22 does not need to be open at all.
#
# Registry is ECR rather than GHCR because the box's instance role (ec2-use-case) already
# carries AmazonEC2ContainerRegistryReadOnly — it authenticates as itself, so no registry
# credential is shipped to the box or stored on it.
#
# Secrets reach the box through Parameter Store, NOT through the SSM command text. An SSM
# command's payload is retained in command history and is readable by any principal with
# ssm:GetCommandInvocation on the account, so anything embedded in it is effectively logged.
# The box fetches and decrypts the .env itself, with its own role.
#
# PREREQUISITES (one-time, all IAM/AWS — see the migration plan):
#   1. ECR repository `news-media-app` exists in ap-southeast-1.
#   2. Role `ec2-use-case` (the box) has AmazonSSMManagedInstanceCore  [done 2026-11-12]
#      plus ssm:GetParameter on /newsicons/* and kms:Decrypt for the aws/ssm key.
#   3. A GitHub OIDC deploy role trusting repo:FORHU/news-media-app, with ECR push,
#      ssm:PutParameter on /newsicons/*, and ssm:SendCommand on this instance only.
#      Its ARN goes in the repo variable AWS_DEPLOY_ROLE_ARN.
#
# Only ONE deploy workflow may be enabled at a time: this and deploy-production.yml both
# trigger on a successful CI run, so enabling both ships the same commit to the box AND
# to Coolify.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: true
        default: main

concurrency:
  group: news-media-app-deploy-ec2
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  ACCOUNT_ID: "617163942417"
  ECR_REPOSITORY: news-media-app
  INSTANCE_ID: i-09971b56ae34dbcd4
  APP_DIR: /opt/news-media-app
  ENV_PARAM: /newsicons/api-env
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Build, Push & Deploy (EC2 via SSM)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # OIDC, to assume the deploy role

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          # DATABASE_URL is a build-time dummy: npm ci runs prisma generate and next build
          # collects page data, neither of which may touch the real database.
          # NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is real and must match the runtime value —
          # Next bakes it in to encrypt Server Action closures and reads it again to decrypt.
          build-args: |
            DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The box keeps no configuration of its own: .env is rebuilt from secrets every deploy,
      # so a rebuilt box needs no manual restoration.
      - name: Compose .env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          CRAWL_API_URL: ${{ secrets.CRAWL_API_URL }}
          CRAWL_STOP_API_URL: ${{ secrets.CRAWL_STOP_API_URL }}
          GENERATE_CONTENT_API: ${{ secrets.GENERATE_CONTENT_API }}
          NEXT_PUBLIC_TRANSCRIPT_API_URL: ${{ secrets.NEXT_PUBLIC_TRANSCRIPT_API_URL }}
          EXTERNAL_API_WEBHOOK_SECRET: ${{ secrets.EXTERNAL_API_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_QUALITY: ${{ secrets.OPENAI_IMAGE_QUALITY }}
          XPOZ_API_KEY: ${{ secrets.XPOZ_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          MEDIASTACK_API_KEY: ${{ secrets.MEDIASTACK_API_KEY }}
          YOUTUBE_API_V3_KEY: ${{ secrets.YOUTUBE_API_V3_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NEXT_PUBLIC_KAKAO_JS_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          APP_AWS_ACCESS_KEY: ${{ secrets.APP_AWS_ACCESS_KEY }}
          APP_AWS_SECRET_ACCESS_KEY: ${{ secrets.APP_AWS_SECRET_ACCESS_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          # AWS_REGION is a workflow env var, not a secret; the app reads the same name.
          APP_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          umask 077

          # Values are read from the environment with printf rather than interpolated into the
          # script text, so a secret containing a quote, backtick or dollar sign cannot break
          # the file or be executed by the shell that assembles it.
          : > .env
          for k in DATABASE_URL JWT_SECRET SITE_URL COOKIE_SECURE \
                   CRAWL_API_URL CRAWL_STOP_API_URL GENERATE_CONTENT_API \
                   NEXT_PUBLIC_TRANSCRIPT_API_URL EXTERNAL_API_WEBHOOK_SECRET \
                   OPENAI_API_KEY OPENAI_IMAGE_QUALITY XPOZ_API_KEY APIFY_API_TOKEN \
                   SUPADATA_API_KEY MEDIASTACK_API_KEY YOUTUBE_API_V3_KEY RESEND_API_KEY \
                   INDEXNOW_KEY NEXT_PUBLIC_KAKAO_JS_KEY AWS_S3_BUCKET \
                   APP_AWS_ACCESS_KEY APP_AWS_SECRET_ACCESS_KEY \
                   FACEBOOK_PAGE_ID FACEBOOK_PAGE_ACCESS_TOKEN \
                   NEXT_SERVER_ACTIONS_ENCRYPTION_KEY; do
            printf '%s=%s\n' "$k" "${!k-}" >> .env
          done
          printf 'AWS_REGION=%s\n' "${APP_REGION}" >> .env
          printf 'NODE_ENV=%s\n' production >> .env
          printf 'IMAGE_TAG=%s\n' "${IMAGE_TAG}" >> .env

          # Fail loudly here rather than letting the app boot against nothing: a missing
          # DATABASE_URL is the one error that yields a container Docker reports as healthy
          # while it serves an empty site.
          if ! grep -q '^DATABASE_URL=postgresql' .env; then
            echo "::error::DATABASE_URL secret is missing or malformed - refusing to deploy."
            exit 1
          fi
          if ! grep -q '^JWT_SECRET=..*' .env; then
            echo "::error::JWT_SECRET secret is empty - the app will not start."
            exit 1
          fi
          echo "Composed .env with $(wc -l < .env) entries."

      - name: Put .env into Parameter Store
        run: |
          set -euo pipefail

          # A SecureString on the standard tier is capped at 4096 characters. This env is
          # around 2.5 KB today, so adding a few long tokens would push it over and the
          # failure reads as an opaque ValidationException. Say so plainly instead.
          BYTES=$(wc -c < .env)
          echo "env size: ${BYTES} bytes"
          if [ "${BYTES}" -gt 4000 ]; then
            echo "::error::.env is ${BYTES} bytes, at or over Parameter Store's 4096-char standard tier limit. Add --tier Advanced to this step (chargeable) or move bulky values out."
            exit 1
          fi

          # file:// so the value is read from disk: a multi-line body passed as an argument
          # would be subject to shell quoting and argument-length limits.
          aws ssm put-parameter \
            --region "${AWS_REGION}" \
            --name "${ENV_PARAM}" \
            --type SecureString \
            --overwrite \
            --value "file://$(pwd)/.env" \
            --description "news-media-app runtime env, written by deploy-ec2.yml" \
            --query Version --output text
          rm -f .env

      - name: Send deploy command via SSM
        id: send
        run: |
          set -euo pipefail

          # The compose file is not secret, so it travels in the command itself, base64-encoded
          # so that nothing in it can be re-interpreted by the shell assembling the script.
          COMPOSE_B64=$(base64 -w0 docker-compose.prod.yml)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          cat > /tmp/deploy.sh <<SCRIPT
          set -euo pipefail
          mkdir -p ${APP_DIR}
          cd ${APP_DIR}

          echo "${COMPOSE_B64}" | base64 -d > docker-compose.prod.yml

          # The box fetches and decrypts its own env with its own instance role, so no secret
          # appears in this command or in SSM's retained command history.
          umask 077
          aws ssm get-parameter --region ${AWS_REGION} --name ${ENV_PARAM} --with-decryption \
            --query Parameter.Value --output text > .env
          chmod 600 .env
          grep -q '^DATABASE_URL=postgresql' .env || { echo "env fetch looks wrong"; exit 1; }

          aws ecr get-login-password --region ${AWS_REGION} \
            | docker login --username AWS --password-stdin ${REGISTRY}

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps

          # The image's CMD runs "prisma migrate deploy" before serving, so the first response
          # can take a while. Poll for it rather than sleeping on a guess.
          # Note on escaping: this heredoc is UNQUOTED so that the runner substitutes
          # APP_DIR, AWS_REGION, REGISTRY and COMPOSE_B64 above. Anything that must be
          # evaluated on the BOX instead is therefore escaped as \$ — a single backslash.
          code=none
          for i in \$(seq 1 30); do
            code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/api/health || true)
            if [ "\$code" = "200" ]; then
              echo "healthy after \${i} attempt(s)"
              docker image prune -f
              exit 0
            fi
            sleep 5
          done
          echo "app did not become healthy - last status: \${code}"
          docker compose -f docker-compose.prod.yml logs --tail 50 news-media-app
          exit 1
          SCRIPT

          # jq builds the JSON, so a quote anywhere in the script cannot break the payload.
          jq -n --rawfile cmd /tmp/deploy.sh \
            '{commands: ($cmd | rtrimstr("\n") | split("\n"))}' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "deploy news-media-app ${IMAGE_TAG}" \
            --timeout-seconds 900 \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)

          echo "command_id=${CMD_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM command: ${CMD_ID}"

      - name: Wait for deploy to finish
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.send.outputs.command_id }}"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --region "${AWS_REGION}" \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation --region "${AWS_REGION}" \
            --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          if [ "${STATUS}" != "Success" ]; then
            echo "::error::SSM deploy finished as ${STATUS}"
            exit 1
          fi
          echo "Deployed ${IMAGE_TAG} to ${INSTANCE_ID}"
