name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref cancels an in-progress run for it, so a quick
# follow-up push doesn't queue behind an already-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build-time-only dummies. `next build` imports code (auth.ts) that throws when
# JWT_SECRET is unset, and Prisma wants a DATABASE_URL present. Neither is a real
# credential and neither reaches production — Coolify injects the real values.
env:
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
  JWT_SECRET: dummy-build-time-secret-not-for-production-use

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Reuse the Next.js compiler cache between runs so unchanged routes aren't
      # recompiled from scratch. `next build` also type-checks the project, so
      # there is no separate `tsc --noEmit` step.
      #
      # cache-v2: a run cancelled mid-build (this workflow cancels in-progress
      # runs on a new push to the same ref) can be killed while Turbopack is
      # writing to .next/cache, leaving a corrupted font-module cache entry
      # ("next/font/google queries have exactly one entry" build failures).
      # Once saved, restore-keys (which ignore the sha) keep reusing that
      # corrupted cache on every subsequent run — and since the build then
      # fails, a good cache never gets saved to replace it. Bumping this
      # suffix forces a clean cache; bump again if this recurs.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-v2-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-v2-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

  deploy:
    name: Trigger Coolify deploy
    needs: [lint, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Coolify's deploy endpoint queues the deployment and hands back a
      # deployment_uuid; the trigger request succeeding only means Coolify
      # *accepted* the job, not that the deploy itself worked. Poll
      # /api/v1/deployments/{uuid} so this job's pass/fail reflects what
      # actually happened on Coolify, not just whether the ping landed.
      - name: Trigger Coolify deploy and wait for result
        run: |
          set -euo pipefail

          response=$(curl -fsS -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}")
          echo "Trigger response: $response"

          deployment_uuid=$(echo "$response" | jq -r '.deployments[0].deployment_uuid // .deployment_uuid // empty')
          if [ -z "$deployment_uuid" ]; then
            echo "::warning::Could not find a deployment_uuid in Coolify's response — skipping status poll. The trigger was accepted, but this job can't confirm the deploy itself succeeded."
            exit 0
          fi
          echo "Polling deployment $deployment_uuid ..."

          # The deploy endpoint's own host doubles as the API base.
          api_base=$(echo "${{ secrets.COOLIFY_WEBHOOK_URL }}" | sed -E 's#^(https?://[^/]+).*#\1#')

          for i in $(seq 1 60); do
            http_code=$(curl -sS -o /tmp/coolify_status.json -w '%{http_code}' \
              "$api_base/api/v1/deployments/$deployment_uuid" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}" || echo "000")

            if [ "$http_code" = "403" ]; then
              echo "::warning::Coolify rejected the status read with 403 — COOLIFY_WEBHOOK_TOKEN likely only has 'deploy' permission, not 'read'. Grant it read access in Coolify > Keys & Tokens to enable status polling. The trigger itself was accepted; this job can't confirm the deploy's outcome without that permission, so treating it as unconfirmed rather than failed."
              exit 0
            fi
            if [ "$http_code" != "200" ]; then
              echo "  [$i/60] unexpected HTTP $http_code while polling — retrying"
              sleep 10
              continue
            fi

            status=$(jq -r '.status // empty' /tmp/coolify_status.json)
            echo "  [$i/60] status=$status"

            case "$status" in
              finished)
                echo "Coolify deployment finished successfully."
                exit 0
                ;;
              failed|cancelled*)
                echo "::error::Coolify deployment failed (status=$status)."
                cat /tmp/coolify_status.json
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out after 10 minutes waiting for Coolify deployment $deployment_uuid to finish."
          exit 1
