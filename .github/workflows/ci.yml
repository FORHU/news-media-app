name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref cancels an in-progress run for it, so a quick
# follow-up push doesn't queue behind an already-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build-time-only dummies. `next build` imports code (auth.ts) that throws when
# JWT_SECRET is unset, and Prisma wants a DATABASE_URL present. Neither is a real
# credential and neither reaches production — Coolify injects the real values.
env:
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
  JWT_SECRET: dummy-build-time-secret-not-for-production-use

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Reuse the Next.js compiler cache between runs so unchanged routes aren't
      # recompiled from scratch. `next build` also type-checks the project, so
      # there is no separate `tsc --noEmit` step.
      #
      # cache-v3 (was v2): a run cancelled mid-build (this workflow cancels in-progress
      # runs on a new push to the same ref) can be killed while Turbopack is
      # writing to .next/cache, leaving a corrupted font-module cache entry
      # ("next/font/google queries have exactly one entry" build failures).
      # Once saved, restore-keys (which ignore the sha) keep reusing that
      # corrupted cache on every subsequent run — and since the build then
      # fails, a good cache never gets saved to replace it. Bumping this
      # suffix forces a clean cache; bump again if this recurs.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-v3-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-v3-${{ hashFiles('package-lock.json') }}-

      # If the build dies on the Turbopack font error again, wipe the compiler
      # cache and retry once from scratch instead of failing the run. That covers
      # both a poisoned restored cache and a one-off failure fetching Google Fonts
      # (the root layout loads ~20 families), so neither needs a manual cache bump.
      - name: Build
        run: |
          npm run build || {
            echo "::warning::Build failed; retrying once with a clean .next cache."
            rm -rf .next
            npm run build
          }

# Deployment is deliberately NOT part of CI. It lives in deploy-ec2.yml, which triggers on
# this workflow completing successfully on main and ships the image to
# newsicon-production-ec2 (i-09971b56ae34dbcd4) via ECR + SSM.
#
# A `deploy:` job used to sit here and POST to a Coolify webhook. Removed 2026-11-12 with the
# move off Coolify. Two reasons it had to go rather than simply stop being used:
#   * its webhook pointed at 18.143.145.219:8000 — an address the Coolify box lost on a
#     stop/start — so every push to main failed on a 135-second curl timeout;
#   * a failing CI run means deploy-ec2.yml's `workflow_run` trigger never sees
#     conclusion == 'success', so the replacement deploy would never fire on a merge.
