name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref cancels an in-progress run for it, so a quick
# follow-up push doesn't queue behind an already-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build-time-only dummies. `next build` imports code (auth.ts) that throws when
# JWT_SECRET is unset, and Prisma wants a DATABASE_URL present. Neither is a real
# credential and neither reaches production — Coolify injects the real values.
env:
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
  JWT_SECRET: dummy-build-time-secret-not-for-production-use

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Reuse the Next.js compiler cache between runs so unchanged routes aren't
      # recompiled from scratch. `next build` also type-checks the project, so
      # there is no separate `tsc --noEmit` step.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

  deploy:
    name: Trigger Coolify deploy
    needs: [lint, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Coolify deploy webhook
        run: |
          curl -fsS -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}"
